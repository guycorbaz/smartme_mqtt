[workspace]
resolver = "2"
members = [
    "crates/sparkplug-b",
    "crates/smart-me-client",
    "crates/smartme-bridge",
]

[workspace.package]
edition = "2024"
version = "0.4.0-rc5"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# Shared dependencies are declared here as they are introduced (Stories 0.2+).
# Internal crates are referenced by path from smartme-bridge only (one-way graph).
prost = "0.14"
prost-build = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Story 1.6 — smart-me-client transport (TLS mandatory, NFR13): rustls only, no
# native-tls/openssl in the tree; `json` pulls serde_json for typed responses.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",        # TLS backend: rustls only, no native-tls/openssl in the tree
    "webpki-roots",  # baked-in Mozilla roots — container needs no ca-certificates
    "http2",         # api.smart-me.com serves HTTP/2 via Cloudflare
    "json",          # typed responses (serde_json)
    "form",          # OAuth token exchange is a form POST
] }
thiserror = "2"
# Stories 1.11-1.13 — the async shell (2 tasks + 1 channel).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
# MQTT transport. `use-rustls` is a DEFAULT feature and is switched off on
# purpose: it pins rustls-webpki 0.102, which carries unfixed advisories
# (RUSTSEC-2026-0049/0098/0099/0104) and cannot be upgraded past rumqttc's
# `^0.102` requirement. The broker is reached over the local container network
# (the smart-me API's TLS uses the separate, current rustls stack in reqwest),
# so the vulnerable code would be dead weight we still ship. Broker TLS returns
# when rumqttc upgrades its webpki — tracked as an issue.
rumqttc = { version = "0.25", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# File logging (opt-in via SMARTME_LOG_DIR). `max_log_files` — the retention
# window — needs >= 0.2.3; MIT, allowed by deny.toml.
tracing-appender = "0.2.3"
# Story 1.14 — chaos tests need a real broker, not a mock of one.
testcontainers = "0.27"
# Epic 6 — the embedded web UI and the health endpoint (AR11, FR33). Default
# features only: no TLS here, because Traefik terminates it (ADR 0019) and a
# second TLS stack in this binary would be one more thing to keep patched.
# `form` for the configuration screens (Story 6.2): the browser posts
# `application/x-www-form-urlencoded`, which is what a server-rendered form with
# no JavaScript sends. Still no default features — nothing here needs multipart,
# websockets or the tower-http stack.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "form"] }
# Story 5.2 AC4 / AR8 — the running configuration, swapped without a restart.
# A lock would do the job and is the reason this is not one: the poll loop reads
# the period on every tick and the MQTT driver reads it from another task, so a
# writer that blocks readers would put a web form on the critical path of the
# publish loop. `ArcSwap` makes the read wait-free and the write a pointer store.
arc-swap = "1"
