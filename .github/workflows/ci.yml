name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools (protoc, mold, clang)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler mold clang
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools (protoc, mold, clang)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler mold clang
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: test (includes arch_purity, no_context_leak, persist, fixtures)
        run: cargo test --workspace
      # Story 6.1 AC5's second half ([#51]). The `panic-probe` feature adds the
      # one route that panics; without this step the feature is dead code and
      # the test it exists for never runs anywhere. Released images build with
      # default features, so the probe is not in any of them.
      - name: test the panicking-handler guard (feature-gated route)
        run: cargo test -p smartme-bridge --features panic-probe --test a_panicking_handler_does_not_cost_the_meters

  deny:
    name: cargo-deny (licenses + external deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
