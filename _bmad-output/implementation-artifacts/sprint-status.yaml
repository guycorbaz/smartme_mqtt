  # is present and INVALID. Today the bridge refuses to start, so the screen that would
  # repair it is behind the process that refused. Recommended (a) keep refusing — the
  # refusal is FR26's whole point, the faults already reach `docker compose logs`, and a
  # bridge staying up on a configuration it rejected is one restart from somebody believing
  # it runs. But it must be WRITTEN DOWN and the manual must say which.
