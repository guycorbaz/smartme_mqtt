  6-1-the-server-exists-in-every-state-the-bridge-can-be-in: done
  #
  # 2026-08-04 — 6.2 WRITTEN. It is where everything Epic 5 built finally gets a caller:
  # Control::apply, Plan::cost(), Plan::needs_restart(), config::mapping_preview and
  # store::confirm are all written, tested, falsified — and unreachable today.
  #
  # AC5 IS THE ONE NOBODY WOULD HAVE ASKED FOR, and it is not covered by "no auth".
  # PRECISELY BECAUSE there is no login, any page in the operator's browser can POST to
  # the bridge if that browser can reach it: a drive-by reconfiguration needs no
  # credentials to steal, because there are none. The blast radius is a Sparkplug
  # namespace a host persists. Recommended: a same-origin header check — no state, cannot
  # desynchronise, and needs no session to hang a token on, which matters because ADR 0019
  # deliberately has none. Whatever is chosen must be WRITTEN DOWN, or a future reader
  # finds a no-auth UI and reasonably assumes nothing was considered.
  #
  # AC4 is the honesty one: #49 means a new-session change is saved but NOT carried out,
  # so the screen must say "takes effect when you restart" and not "saved" — and must
  # render Control::current(), which reports what is IN FORCE, rather than echoing the
  # submission back.
  #
  # AC3: confirmation is its OWN submission. Folded into the save button it stops being a
  # confirmation and becomes a click made for another reason, which is how a guard turns
  # into a formality. 5.3's model already refuses to let a save assert it.
  #
  # The named trap: validating in the form. It will feel helpful and it is a second copy
  # of every bound in app::config — the drift story 5.1 exists to prevent, showing up as a
  # value the browser accepts and the bridge refuses to boot on.
  #
  # NFR11 (time-to-first-value under 15 min from a clean machine) becomes MEASURABLE for
  # the first time with this story. Measure it and record the number rather than assert it.
  #
  # 2026-08-05 — 6.2 IMPLEMENTED. All seven ACs met. `main.rs` is now a loop over the
  # lifecycle: `phase::decide` re-reads and re-validates the FILE every turn and cannot be
  # handed what a form posted, so the loop structurally cannot become a second source of
  # the configuration. The web server is started once and outlives every phase — rebuilding
  # it per phase would close and re-bind the listener, and a failed bind degrades to "no UI"
  # at exactly the moment the operator had just used it.
  #
  # AC5 decided and RECORDED: same-origin header check, ADR 0024 + [#54]. The scheme is
  # deliberately not compared (Traefik terminates TLS in front of a plain-HTTP bridge) and a
  # request with no Origin is allowed (that is curl, i.e. FR23's headless path).
  #
  # NFR11 MEASURED rather than asserted: 1 s from a clean state directory to a publishing
  # bridge, container only. Printed by docker-smoke.sh on every run, so a creep from seconds
  # to minutes is visible instead of merely under budget.
  #
  # FOURTEEN MUTATIONS, ALL RED — and two of the assertions were HOLLOW until they ran:
  #  - AC2 searched the page for "group_id"/"publish_period_secs"/"serial", which are the
  #    form's own input names and are present whether a fault was rendered or not. The green
  #    hid a REAL DEFECT: the screen bound faults by `Fault::field` (a human label, "publish
  #    period") instead of `Fault::source` (the key, `publish_period_secs`), so nothing was
  #    ever shown beside its field — which is precisely what AC2 asks for. Fixing the
  #    assertion is what exposed the code. `check_serial` also carried no source and now does.
  #  - AC4 searched for "in force now", which the change TABLE prints on every hot row, so a
  #    mutation making the verdict say the opposite left it green.
  #    Same family as `log.contains('3')` satisfied by the log's own timestamp.
  #
  # AND THE IMAGE SMOKE TEST FOUND A DEPLOYMENT TRAP no unit test could: the state directory
  # is unwritable to uid 10002 unless it was chowned, which is the documented step everyone
  # forgets — every earlier check only READ it. The screen says "the configuration was NOT
  # written" and changes nothing; that behaviour is now locked in by its own check.
  #
  # A cross-binary port lock was added: a first run has no file to read a port from, so every
  # test of an unconfigured bridge wants DEFAULT_PORT, and cargo runs test binaries in
  # parallel. Without it the loser reports "the UI never answered" — a flake that impersonates
  # the very defect these tests exist to catch.
