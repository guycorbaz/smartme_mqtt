  # AC3 is the one most likely to be got wrong and the failure is expensive: Epic 7 wires
  # /healthz to a Docker healthcheck that RESTARTS the container. A /healthz reporting
  # unhealthy because no configuration exists would put a fresh deployment in a restart
  # loop — destroying, every few seconds, the screen needed to configure it.
