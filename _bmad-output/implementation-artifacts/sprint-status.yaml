  # 2026-08-01: contexted AND implemented, status `review`.
  # THE MECHANISM, which is not obvious and is why AC1 was amended to demand it: the old
  # discriminator `death_stamp > birth_stamp` was sound ONLY because the will is serialised
  # ONCE, inside the first CONNECT, so it can never be stamped after any birth. Story 4.10
  # rebuilds the will PER CONNECT -- a will registered on a later connection is stamped later
  # than the birth this test captured on the first one, so a WILL satisfies the inequality and
  # the test goes green on the exact regression it guards. No compile error, no edited
  # assertion, no failing run would announce it.
  # REPLACEMENT: COUNT the certificates. A graceful stop produces TWO NDEATHs (the bridge's
  # own, then the will when the socket drops) and the will can fire ONCE. Reads no clock, so
  # 4.10 cannot disturb it. This converts a measurement ADR 0011 ALREADY RECORDED into the
  # discriminator rather than inventing a mechanism.
  # NO CONTENT-BASED DISCRIMINATOR CAN EXIST: tck-id-...-death-payload (Sparkplug_5:808-812)
  # says the shutdown payload IS the registered will, so the two are byte-identical. Any
  # proposal to "tag" the explicit death would be a conformance violation invented to make a
  # test easier. The count is the only property they do not share.
  # THE OLD ASSERTION WAS REMOVED, NOT SUPPLEMENTED (AC3, added at contexting): keeping both
  # would leave an assertion that passes for a reason that has stopped being true next to one
  # that works, and a reader cannot tell which carries the proof. chaos_ncmd_subscription had
  # exactly that shape and it cost a story.
