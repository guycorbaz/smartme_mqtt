# STATUS DEFINITIONS:
# ==================
# Epic Status:
#   - backlog: Epic not yet started
#   - in-progress: Epic actively being worked on
#   - done: All stories in epic completed
#
# Epic Status Transitions:
#   - backlog → in-progress: Automatically when first story is created (via create-story)
#   - in-progress → done: Manually when all stories reach 'done' status
#
# Story Status:
#   - backlog: Story only exists in epic file
#   - ready-for-dev: Story file created in stories folder
#   - in-progress: Developer actively working on implementation
#   - review: Ready for code review (via Dev's code-review workflow)
#   - done: Story completed
#   - withdrawn: the story's REQUIREMENT was withdrawn; the file is kept as the
#     record of why. Added 2026-08-12 for story 2.4 (FR14, ADR 0033). It is not
#     `done` (nothing was built) and not `backlog` (nothing is waiting).
#
# Retrospective Status:
#   - optional: Can be completed but not required
#   - required: MUST be run before the epic is considered closed (added 2026-08-10)
#   - done: Retrospective has been completed
#
# `required` EXISTS BECAUSE `optional` WAS TAKEN LITERALLY. Epic 5's retrospective
# (2026-08-10) counted the record: ONE retrospective in eight epics — epic 1's, on
# 2026-07-26 — and epics 5 to 8 carried no retrospective line at all, the same
# omission that had kept epics 7 and 8 out of this file until 2026-08-08.
# It also measured what the one retrospective was worth: of its six action items,
# FIVE were honoured and their effect is visible in the work, and the SIXTH — verify
# each AC actually covers the NFR it claims — was not, and is precisely what produced
# Epic 5's main defect (three stories with boxes ticked for absent work). A process
# with that hit rate should not be optional. Action item B3.
# Epic 0 stays `optional`: it closed long ago and a retrospective now would collect
# nothing that is still actionable.
#
# AMENDED 2026-08-10, same day, by Guy: *"les retrospectives sont à faire quand
# c'est terminé."* `required` therefore means exactly what its wording says — the
# retrospective is a CONDITION OF CLOSING an epic, not a debt an unfinished epic
# carries. The Epic 5 retrospective's action B3 said the epic 3 and epic 4
# retrospectives were "owed"; they are not, because neither epic is finished
# (Epic 3 is at 3 of 6 stories, Epic 4 at 10 of 19). What B3 correctly established
# is that a retrospective may no longer be skipped at the moment an epic closes,
# which is what cost this project its only unhonoured action item.
#
# WORKFLOW NOTES:
# ===============
# - Epic transitions to 'in-progress' automatically when first story is created
# - Stories can be worked in parallel if team capacity allows
# - Developer typically creates next story after previous one is 'done' to incorporate learnings
# - Dev moves story to 'review', then runs code-review (fresh context, different LLM recommended)
# - Project note: story 1.1 needs a real smart-me API capture; 1.15 is a manual
