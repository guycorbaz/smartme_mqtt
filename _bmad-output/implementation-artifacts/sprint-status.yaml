  # direction shown deliberately, since an expected-red never demonstrated green proves only
  # that a test can fail. (B) THE DECIDING ONE: will stamped now+60_000 (Story 4.10 simulated)
  # AND no explicit death, with a temporary probe printing what the OLD assertion would have
  # concluded -- `death_stamp(...) > birth_stamp(...) = true`, i.e. IT WOULD HAVE PASSED, while
  # the count FAILED. On identical broken code the two discriminators disagree. That is the
  # story's whole premise, measured rather than reasoned. Probe removed before commit; driver
  # restored byte-for-byte (git diff empty) and the suite re-run green 7.94s.
