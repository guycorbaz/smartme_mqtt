  # ADDED 2026-08-08, previously absent from this file entirely.
  #
  # THIS IS THE EPIC THE PANORAMIX GATE LANDS IN, once the fleet works: compose
  # behind Traefik, the healthcheck, zero-config-loss image updates.
  #
  # TWO DECISIONS ARE ALREADY OWED TO IT, and they are the same decision seen
  # from two sides — taking them apart would be taking two half-decisions:
  #  1. **Nothing inside the image can consume `/healthz`** ([#56]). The runtime
  #     image has no `curl`, no `wget`, and its shell is not bash, so `/dev/tcp`
  #     is out. There is no HEALTHCHECK line; `Dockerfile:97` says its absence is
  #     a decision. So AR12's restart cannot fire in a real deployment, and the
  #     503 path has never been exercised the way it will be used.
  #  2. **What a `500` from `/healthz` should mean.** Since 2026-08-08 a panicking
  #     UI handler answers 500 (story 6.1 AC5's guard). ADR 0027 §2 deliberately
  #     keeps non-200 codes for a WEDGED POLLER only, because this epic wires them
  #     to a container restart and a restart kills the Sparkplug session for every
  #     meter. A panic in a DISPLAY handler must not restart the bridge.
