  # refusal is FR26's point, the faults already reach `docker compose logs`, and a bridge
  # staying up on a configuration it rejected is one restart from being believed. Written
  # into main.rs beside the refusal and into the manual.
  #
  # TWO FALSIFICATION LESSONS, and the first is the sharper:
  #  - the /healthz mutation MISSED ITS TARGET and the test stayed green — rustfmt had
  #    folded the return tuple onto one line, so the multi-line pattern matched nothing.
  #    A mutation that does not apply proves exactly as much as no mutation. The second
  #    attempt asserts the text changed BEFORE running anything, and then it went red.
  #  - the image smoke test's first draft probed /dev/tcp INSIDE the container, which is a
  #    bash feature the image's shell does not have — it reported "no web UI" against a
  #    server that was answering perfectly. It probes from the host now, over a port
  #    published to loopback for the duration of the check only.
