[package]
name = "smartme-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The smartme_mqtt bridge application: canonical Measurement, state machine, adapters, web UI, wiring."

[features]
# The panicking route Story 6.1 AC5 needs to assert its second half ([#51]).
# Off by default and never enabled by `docker-publish.yml`, so no released image
# carries it. `ci-local.sh` and `ci.yml` run the one test that turns it on.
panic-probe = []

[dependencies]
sparkplug-b = { path = "../sparkplug-b" }
smart-me-client = { path = "../smart-me-client" }
serde = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
rumqttc = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
thiserror = { workspace = true }
arc-swap = { workspace = true }
axum = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
testcontainers = { workspace = true }
