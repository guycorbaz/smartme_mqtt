[package]
name = "sparkplug-b"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pure, generic Sparkplug B library: protobuf encode/decode, EON node/device model, seq/bdSeq/rebirth lifecycle."
# The publication bar NFR19 describes (story 8.2). `cargo publish --dry-run` is the
# arbiter of what is required here: the rules are crates.io's, not this project's.
repository = "https://github.com/guycorbaz/smartme_mqtt"
readme = "README.md"
keywords = ["sparkplug", "mqtt", "iiot", "scada", "protobuf"]
categories = ["network-programming", "encoding"]

[dependencies]
prost = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }

# Story 1.15 — the Tier-3 Ignition contract test needs to put real bytes on a
# real broker. These are DEV-dependencies: they do not appear in the dependency
# graph of anyone who consumes the published crate, and the isolated-build guard
# (`cargo build -p sparkplug-b --no-default-features`) never compiles them.
[dev-dependencies]
rumqttc = { workspace = true }
tokio = { workspace = true }
